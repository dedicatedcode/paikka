server.port=8080

server.compression.enabled=true
# Minimum response size to trigger compression
server.compression.min-response-size=1024
# Content types to compress
server.compression.mime-types=text/plain,application/json

# Static resource caching - only for actual static resources, not HTML templates
spring.web.resources.cache.cachecontrol.max-age=31536000
spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**,/img/**,/fonts/**

paikka.version=1.1.7
paikka.data-dir=./data
paikka.import.threads=16
paikka.import.chunk-size=100000

paikka.admin.password=

paikka.query.max-results=500
paikka.query.default-results=10
paikka.query.base-url=http://localhost:8080


paikka.simplification.continent-tolerance=0.005
paikka.simplification.country-tolerance=0.00045
paikka.simplification.state-tolerance=0.00009
paikka.simplification.poi-tolerance=0.000018
paikka.simplification.default-tolerance=0.000045

paikka.stats-db-path=./data/stats.db
paikka.stats-db.flush=0/10 * * * * *

logging.level.com.dedicatedcode.paikka=INFO
logging.level.root=WARN
